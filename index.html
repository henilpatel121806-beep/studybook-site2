<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Logbook — Study & Finance Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12181f;
  --ink-soft:#232c37;
  --paper:#f6f4ee;
  --paper-line:#e3ded1;
  --card:#fffdf8;
  --card-border:#ddd6c4;
  --amber:#c9821f;
  --amber-soft:#f0dcb8;
  --green:#3f7d54;
  --red:#a8402f;
  --blue:#3a5f8a;
  --muted:#6c7280;
  --radius:3px;
  --serif:'Source Serif 4', Georgia, serif;
  --sans:'IBM Plex Sans', -apple-system, sans-serif;
  --mono:'IBM Plex Mono', 'SFMono-Regular', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--sans);
  background:
    linear-gradient(var(--paper-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--paper-line) 1px, transparent 1px),
    var(--paper);
  background-size:28px 28px;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--amber-soft);}

/* ---------- Layout shell ---------- */
#app{display:flex;min-height:100vh;}
#sidebar{
  width:230px;flex-shrink:0;background:var(--ink);color:#dfe3e8;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
#sidebar .brand{
  padding:22px 20px 16px;font-family:var(--serif);font-size:20px;font-weight:600;
  border-bottom:1px solid #2a3441;color:#f4efe3;letter-spacing:.2px;
}
#sidebar .brand span{color:var(--amber);}
#sidebar nav{flex:1;overflow-y:auto;padding:10px 0;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 20px;font-size:13.5px;
  color:#aab2bd;border-left:3px solid transparent;cursor:pointer;white-space:nowrap;
}
.nav-item:hover{color:#f4efe3;background:#1a222c;}
.nav-item.active{color:#f4efe3;border-left-color:var(--amber);background:#1a222c;font-weight:500;}
.nav-icon{width:16px;text-align:center;font-size:13px;opacity:.85;}
.nav-group-label{padding:14px 20px 4px;font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:#5c6472;}
#sidebar .foot{padding:14px 20px;font-size:11px;color:#5c6472;border-top:1px solid #2a3441;font-family:var(--mono);}

#main{flex:1;min-width:0;padding:26px 34px 90px;max-width:1200px;}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
.topbar h1{font-family:var(--serif);font-size:26px;margin:0 0 4px;font-weight:600;}
.topbar .sub{color:var(--muted);font-size:13.5px;}
.datebadge{font-family:var(--mono);font-size:12px;color:var(--muted);border:1px solid var(--card-border);padding:5px 10px;border-radius:var(--radius);background:var(--card);}

/* mobile nav */
#mobilenav{display:none;}
#mobile-topbar{display:none;}
#more-sheet{display:none;}

/* ---------- Cards / sections ---------- */
.section{margin-bottom:30px;}
.section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
.section-head h2{font-family:var(--serif);font-size:18px;margin:0;font-weight:600;}
.section-head .link-btn{font-size:12.5px;color:var(--blue);}

.grid{display:grid;gap:14px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:900px){.grid-3,.grid-4{grid-template-columns:repeat(2,1fr);} .grid-2{grid-template-columns:1fr;}}

.card{
  background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);
  padding:16px 18px;
}
.card.flush{padding:0;}
.stat{display:flex;flex-direction:column;gap:4px;}
.stat .label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.stat .value{font-family:var(--mono);font-size:22px;font-weight:600;}
.stat .value.small{font-size:16px;}
.stat .delta{font-size:11.5px;color:var(--muted);}

.progress-track{height:8px;background:#eee7d5;border-radius:5px;overflow:hidden;margin:8px 0;}
.progress-fill{height:100%;background:var(--amber);}
.progress-fill.green{background:var(--green);}
.progress-fill.red{background:var(--red);}

.hr{border:none;border-top:1px solid var(--card-border);margin:14px 0;}

.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;letter-spacing:.2px;}
.pill.critical{background:#f3dcd6;color:var(--red);}
.pill.high{background:#f5e6cd;color:var(--amber);}
.pill.medium{background:#dde7f0;color:var(--blue);}
.pill.low{background:#e2e8dd;color:var(--green);}
.pill.status{background:#eee9dc;color:var(--muted);}
.pill.done{background:#dcebe0;color:var(--green);}

.btn{
  border:1px solid var(--ink);background:var(--ink);color:#f6f4ee;padding:8px 14px;
  border-radius:var(--radius);font-size:13px;font-weight:500;
}
.btn:hover{background:#232c37;}
.btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--card-border);}
.btn.secondary:hover{border-color:var(--ink);}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#fff;}
.btn.sm{padding:4px 9px;font-size:12px;}
.btn.danger{background:transparent;color:var(--red);border:1px solid #e3c3bb;}
.icon-btn{background:transparent;border:none;color:var(--muted);font-size:14px;padding:2px 4px;}
.icon-btn:hover{color:var(--ink);}

.list{display:flex;flex-direction:column;}
.list-row{
  display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--paper-line);
}
.list-row:last-child{border-bottom:none;}
.list-row .main{flex:1;min-width:0;}
.list-row .title{font-weight:500;font-size:13.8px;}
.list-row .meta{font-size:11.8px;color:var(--muted);margin-top:2px;}
.checkbox{
  width:19px;height:19px;border:1.5px solid var(--card-border);border-radius:4px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;
}
.checkbox.checked{background:var(--green);border-color:var(--green);}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--card-border);margin-bottom:16px;flex-wrap:wrap;}
.tab{padding:8px 14px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;}
.tab.active{color:var(--ink);border-bottom-color:var(--amber);font-weight:600;}

.empty{padding:26px 10px;text-align:center;color:var(--muted);font-size:13.5px;}
.empty .big{font-size:28px;display:block;margin-bottom:8px;}

/* form */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.field label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
.field input,.field select,.field textarea{
  border:1px solid var(--card-border);border-radius:var(--radius);padding:8px 10px;font-size:13.5px;background:#fff;
}
.field textarea{resize:vertical;min-height:56px;}
.formrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:600px){.formrow{grid-template-columns:1fr;}}

/* modal */
.overlay{
  position:fixed;inset:0;background:rgba(18,24,31,.45);display:flex;align-items:center;justify-content:center;
  z-index:200;padding:16px;
}
.modal{
  background:var(--paper);border:1px solid var(--card-border);border-radius:6px;width:100%;max-width:520px;
  max-height:88vh;overflow-y:auto;padding:22px 24px;
}
.modal h3{font-family:var(--serif);margin:0 0 16px;font-size:19px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}

/* FAB */
#fab{
  position:fixed;right:26px;bottom:26px;width:54px;height:54px;border-radius:50%;
  background:var(--amber);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;
  border:none;box-shadow:0 3px 10px rgba(0,0,0,.25);z-index:100;
}

/* timer bar */
#timerbar{
  position:fixed;left:230px;right:0;bottom:0;background:var(--ink);color:#f4efe3;padding:10px 24px;
  display:none;align-items:center;gap:16px;z-index:150;font-family:var(--mono);
}
#timerbar.show{display:flex;}
#timerbar .t-title{font-family:var(--sans);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#timerbar .t-clock{font-size:20px;font-weight:600;color:var(--amber);}
#timerbar button{background:transparent;border:1px solid #3a4453;color:#f4efe3;border-radius:4px;padding:5px 10px;font-family:var(--sans);font-size:12px;}

/* revision colors */
.retention-good{color:var(--green);} .retention-weak{color:var(--red);} .retention-ok{color:var(--amber);}

/* donut */
.donut{width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.donut .center{background:var(--card);width:76px;height:76px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.donut .center b{font-family:var(--mono);font-size:19px;}
.donut .center span{font-size:10px;color:var(--muted);}

/* bar chart */
.barchart{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:10px;}
.barchart .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;}
.barchart .bar{width:100%;border-radius:2px 2px 0 0;background:var(--amber);min-height:2px;}
.barchart .bar.money{background:var(--blue);}
.barchart .bar-label{font-size:10px;color:var(--muted);font-family:var(--mono);}

/* calendar */
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.calgrid .dow{font-size:10.5px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.5px;padding-bottom:4px;}
.calday{
  border:1px solid var(--card-border);border-radius:4px;min-height:78px;padding:6px;font-size:11px;background:var(--card);
  cursor:pointer;
}
.calday.other{opacity:.35;}
.calday.today{border-color:var(--amber);border-width:2px;}
.calday .d-num{font-family:var(--mono);font-weight:600;font-size:12px;}
.calday .dots{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap;}
.dot{width:6px;height:6px;border-radius:50%;}
.dot.study{background:var(--amber);} .dot.rev{background:var(--blue);} .dot.exam{background:var(--red);} .dot.fin{background:var(--green);}

@media(max-width:860px){
  #sidebar{display:none;}
  #timerbar{left:0;}
  #main{padding:14px 14px 140px;max-width:none;}
  #mobile-topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  #mobile-topbar .brand{font-family:var(--serif);font-weight:600;font-size:18px;}
  #mobile-topbar .brand span{color:var(--amber);}
  #mobilenav{
    display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--ink);z-index:120;
    border-top:1px solid #2a3441;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  #mobilenav.hidden{display:none;}
  .mnav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:#aab2bd;font-size:10px;padding:6px 0;}
  .mnav-item.active{color:var(--amber);}
  .mnav-item .mi{font-size:17px;}
  #fab{right:16px;bottom:76px;}
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr 1fr;}
  #more-sheet{
    position:fixed;inset:0;background:rgba(18,24,31,.5);z-index:140;display:none;
  }
  #more-sheet.show{display:flex;align-items:flex-end;}
  #more-sheet .sheet{
    background:var(--paper);width:100%;border-radius:14px 14px 0 0;padding:18px 8px 26px;max-height:70vh;overflow-y:auto;
  }
  #more-sheet .nav-item{color:var(--ink);border-left:none;padding:12px 20px;font-size:14.5px;}
  #more-sheet .nav-item.active{background:var(--amber-soft);border-radius:6px;}
  #more-sheet .nav-group-label{color:var(--muted);}
}
</style>

<body>
<div id="auth-screen" style="display:none;position:fixed;inset:0;background:var(--paper);z-index:300;align-items:center;justify-content:center;padding:16px;">
  <div class="card" style="max-width:360px;width:100%;">
    <div style="font-family:var(--serif);font-size:22px;font-weight:600;margin-bottom:4px;">📓 Logbook</div>
    <div class="meta" style="color:var(--muted);margin-bottom:16px;">Sign in to sync your data across devices.</div>
    <div id="auth-error" style="display:none;color:var(--red);font-size:12.5px;margin-bottom:10px;background:#f3dcd6;padding:8px 10px;border-radius:3px;"></div>
    <div class="field"><label>Email</label><input type="email" id="auth-email" placeholder="you@example.com"></div>
    <div class="field"><label>Password</label><input type="password" id="auth-password" placeholder="At least 6 characters"></div>
    <button class="btn amber" style="width:100%;margin-bottom:8px;" onclick="authSignIn()">Log in</button>
    <button class="btn secondary" style="width:100%;" onclick="authSignUp()">Create account</button>
    <div id="auth-loading" style="display:none;text-align:center;font-size:12.5px;color:var(--muted);margin-top:10px;">Working…</div>
  </div>
</div>
<div id="app">
  <aside id="sidebar">
    <div class="brand">📓 Log<span>book</span></div>
    <nav id="nav"></nav>
    <div class="foot" id="sidebar-foot"></div>
  </aside>

  <main id="main">
    <div id="mobile-topbar">
      <div class="brand">📓 Log<span>book</span></div>
      <span class="datebadge" id="mobile-date"></span>
    </div>
    <div id="view"></div>
  </main>
</div>

<nav id="mobilenav">
  <div class="mnav-item" data-view="dashboard"><span class="mi">🏠</span>Home</div>
  <div class="mnav-item" data-view="study"><span class="mi">📚</span>Study</div>
  <div class="mnav-item" data-view="finance"><span class="mi">💰</span>Finance</div>
  <div class="mnav-item" data-view="calendar"><span class="mi">📅</span>Calendar</div>
  <div class="mnav-item" id="more-toggle"><span class="mi">☰</span>More</div>
</nav>

<div id="more-sheet"><div class="sheet" id="more-sheet-nav"></div></div>

<button id="fab" title="Quick add">+</button>

<div id="timerbar">
  <span class="t-title" id="tb-title">—</span>
  <span class="t-clock" id="tb-clock">00:00</span>
  <button id="tb-pause">Pause</button>
  <button id="tb-stop">Stop</button>
</div>

<div id="modal-root"></div>
<datalist id="subject-namelist"></datalist>

<script>
/* ============================================================
   FIREBASE (login + cross-device sync)
   ------------------------------------------------------------
   Fill in your own project's config below (Firebase console ->
   Project settings -> General -> "Your apps" -> SDK setup and
   configuration -> Config). Leave the placeholder as-is and the
   app runs in local-only mode (no login, data stays on this
   device/browser only).
============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyA6uxWRyYOqyvO-CUCxQ41eq_8K2yRMi4o",
  authDomain: "studybook-f0640.firebaseapp.com",
  projectId: "studybook-f0640",
  storageBucket: "studybook-f0640.firebasestorage.app",
  messagingSenderId: "190188805579",
  appId: "1:190188805579:web:cdafc1a756c3d80ff42a4e"
};
const FIREBASE_ENABLED = firebaseConfig.apiKey !== "YOUR_API_KEY";
/* Set this to true only after you've enabled Firebase Storage (requires the Blaze billing plan).
   Left false, PYQ PDF uploads stay on the local device instead of syncing across devices. */
const FIREBASE_STORAGE_ENABLED = false;
let fbAuth=null, fbDb=null, fbStorage=null, currentUser=null;
if(FIREBASE_ENABLED){
  firebase.initializeApp(firebaseConfig);
  fbAuth = firebase.auth();
  fbDb = firebase.firestore();
  fbStorage = firebase.storage();
}
function showAuthError(msg){
  const el=document.getElementById('auth-error');
  if(el){ el.textContent=msg; el.style.display='block'; }
}
function setAuthLoading(on){
  const el=document.getElementById('auth-loading'); if(el) el.style.display = on? 'block':'none';
}
function authSignUp(){
  const email=val('auth-email'), pass=val('auth-password');
  if(!email || !pass){ showAuthError('Enter an email and password.'); return; }
  setAuthLoading(true);
  fbAuth.createUserWithEmailAndPassword(email,pass)
    .catch(e=>showAuthError(e.message))
    .finally(()=>setAuthLoading(false));
}
function authSignIn(){
  const email=val('auth-email'), pass=val('auth-password');
  if(!email || !pass){ showAuthError('Enter an email and password.'); return; }
  setAuthLoading(true);
  fbAuth.signInWithEmailAndPassword(email,pass)
    .catch(e=>showAuthError(e.message))
    .finally(()=>setAuthLoading(false));
}
function authSignOut(){ if(fbAuth) fbAuth.signOut(); }
function initAuth(){
  fbAuth.onAuthStateChanged(async user=>{
    if(user){
      currentUser=user;
      document.getElementById('auth-screen').style.display='none';
      document.getElementById('app').style.display='flex';
      await loadState();
    } else {
      currentUser=null;
      document.getElementById('app').style.display='none';
      document.getElementById('auth-screen').style.display='flex';
    }
  });
}

/* ============================================================
   STATE + STORAGE
============================================================ */
const STORAGE_KEY = 'logbook-state-v1';
const HAS_CLAUDE_STORAGE = (typeof window.storage !== 'undefined') && window.storage && typeof window.storage.get==='function';
async function storageGet(key){
  const isFile = key.startsWith('pyqfile-');
  if(FIREBASE_ENABLED && currentUser && (!isFile || FIREBASE_STORAGE_ENABLED)){
    if(isFile){
      try{
        const url = await fbStorage.ref('users/'+currentUser.uid+'/files/'+key).getDownloadURL();
        return {key, value:url, shared:false, isUrl:true};
      }catch(e){ return null; }
    }
    const doc = await fbDb.collection('users').doc(currentUser.uid).collection('data').doc(key).get();
    return doc.exists ? {key, value:doc.data().value, shared:false} : null;
  }
  if(HAS_CLAUDE_STORAGE){ return window.storage.get(key, false); }
  const v = localStorage.getItem(key);
  return v!==null ? {key, value:v, shared:false} : null;
}
async function storageSet(key,value){
  const isFile = key.startsWith('pyqfile-');
  if(FIREBASE_ENABLED && currentUser && (!isFile || FIREBASE_STORAGE_ENABLED)){
    if(isFile){
      await fbStorage.ref('users/'+currentUser.uid+'/files/'+key).putString(value, 'data_url');
      return {key, value, shared:false};
    }
    await fbDb.collection('users').doc(currentUser.uid).collection('data').doc(key).set({value});
    return {key, value, shared:false};
  }
  if(HAS_CLAUDE_STORAGE){ return window.storage.set(key, value, false); }
  localStorage.setItem(key, value);
  return {key, value, shared:false};
}
async function storageDelete(key){
  const isFile = key.startsWith('pyqfile-');
  if(FIREBASE_ENABLED && currentUser && (!isFile || FIREBASE_STORAGE_ENABLED)){
    if(isFile){
      try{ await fbStorage.ref('users/'+currentUser.uid+'/files/'+key).delete(); }catch(e){}
      return {key, deleted:true, shared:false};
    }
    await fbDb.collection('users').doc(currentUser.uid).collection('data').doc(key).delete();
    return {key, deleted:true, shared:false};
  }
  if(HAS_CLAUDE_STORAGE){ return window.storage.delete(key, false); }
  localStorage.removeItem(key);
  return {key, deleted:true, shared:false};
}
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const todayStr = () => fmtDate(new Date());
function fmtDate(d){ const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function addDays(dateStr,n){ const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n); return fmtDate(d); }
function daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000); }
function humanDate(dateStr){
  if(!dateStr) return '—';
  const diff = daysBetween(todayStr(), dateStr);
  const d = new Date(dateStr+'T00:00:00');
  const base = d.toLocaleDateString('en-IN',{day:'numeric',month:'short'});
  if(diff===0) return 'Today';
  if(diff===1) return 'Tomorrow';
  if(diff===-1) return 'Yesterday';
  return base;
}
function money(n){ return (state.settings.currency||'₹') + Math.round(n).toLocaleString('en-IN'); }
function minsToHM(m){ m=Math.round(m||0); const h=Math.floor(m/60), mm=m%60; return h>0? `${h}h ${mm}m` : `${mm}m`; }

function defaultState(){
  return {
    subjects:[
      {id:uid(),name:'CMOS',color:'#c9821f',semesterId:''},
      {id:uid(),name:'STA',color:'#3a5f8a',semesterId:''},
      {id:uid(),name:'DSP',color:'#3f7d54',semesterId:''},

let saveTimer=null;
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async ()=>{
    try{ await storageSet(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){ console.error('save failed', e); }
  }, 350);
}
async function loadState(){
  try{
    const res = await storageGet(STORAGE_KEY);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      state = Object.assign(defaultState(), parsed);
      // ensure nested defaults exist
      state.settings = Object.assign(defaultState().settings, parsed.settings||{});
      state.budget = Object.assign(defaultState().budget, parsed.budget||{});
    }
  }catch(e){ /* no saved state yet */ }
  render();
}

function subjectName(id){ const s=state.subjects.find(s=>s.id===id); return s? s.name : '—'; }
function tasksFor(dateStr){ return state.tasks.filter(t=>t.plannedDate===dateStr); }
function revisionsFor(dateStr){ return state.revisions.filter(r=>r.date===dateStr && r.status==='pending'); }
function overdueRevisions(){ return state.revisions.filter(r=>r.status==='pending' && r.date<todayStr()); }
function upcomingRevisions(days=7){ return state.revisions.filter(r=>r.status==='pending' && r.date>todayStr() && daysBetween(todayStr(),r.date)<=days); }

function monthExpenses(ym){ return state.expenses.filter(e=>e.date.startsWith(ym)).reduce((a,e)=>a+Number(e.amount),0); }
function monthIncome(ym){ return state.incomes.filter(e=>e.date.startsWith(ym)).reduce((a,e)=>a+Number(e.amount),0); }
function currentYM(){ return todayStr().slice(0,7); }
function portfolioValue(){ return state.investments.reduce((a,i)=>a+Number(i.currentValue||i.amount),0); }

function studyStreak(){
  let streak=0, d=todayStr();
  while(true){
    const done = state.tasks.some(t=>t.plannedDate===d && (t.status==='Completed'));
    const sess = state.sessions.some(s=>s.date===d);
    if(done||sess){ streak++; d=addDays(d,-1); } else break;
    if(streak>365) break;
  }
  return streak;
}

function taskGroup(tasks){
  if(!tasks.length) return `<div class="empty">Nothing here.</div>`;
  return `<div class="card flush"><div class="list" style="padding:4px 12px;">${tasks.map(t=>taskRow(t)).join('')}</div></div>`;
}
function taskRow(t){
  const overdue = t.deadline && t.deadline<todayStr() && t.status!=='Completed';
  return `<div class="list-row">
    <div class="checkbox ${t.status==='Completed'?'checked':''}" onclick="quickToggleTask('${t.id}')">${t.status==='Completed'?'✓':''}</div>
    <div class="main" onclick="openTaskModal('${t.id}')" style="cursor:pointer;">
      <div class="title">${t.title} ${overdue?'<span style="color:var(--red);font-size:11px;">· overdue</span>':''}</div>
      <div class="meta">${subjectName(t.subjectId)}${t.unit? ' · '+t.unit:''} · ${t.type} · ${t.progress||0}%</div>
      <div class="progress-track" style="max-width:180px;"><div class="progress-fill ${t.status==='Completed'?'green':''}" style="width:${t.progress||0}%"></div></div>
    </div>
    <button class="icon-btn" title="Start timer" onclick="event.stopPropagation();startTimer('${t.id}')">⏱</button>
    <span class="pill ${(t.priority||'medium').toLowerCase()}">${t.priority}</span>
  </div>`;
}
function revisionRow(r){
  return `<div class="list-row">
    <div class="main"><div class="title">${r.topic}</div><div class="meta">${subjectName(r.subjectId)} · rev #${r.index}</div></div>
    <button class="btn secondary sm" onclick="openRevisionAction('${r.id}')">Review</button>
  </div>`;
}
function quickToggleTask(id){
  const t = state.tasks.find(x=>x.id===id);
  if(!t) return;
  if(t.status==='Completed'){ t.status='In Progress'; t.progress=t.progress===100?50:t.progress; }
  else { completeTask(t.id); }
  scheduleSave(); render();
}
function completeTask(id){
  const t = state.tasks.find(x=>x.id===id); if(!t) return;
  t.status='Completed'; t.progress=100; t.completedAt=todayStr();
  scheduleSave();
  if(t.type!=='Revision' && !state.revSeries.some(s=>s.taskId===t.id)){
    openRevisionSetup(t);
  } else { render(); }
}
function planTomorrow(){
  const unfinished = tasksFor(todayStr()).filter(t=>t.status!=='Completed');
  if(!unfinished.length){ goTo('tomorrow'); return; }
  showModal(`
    <h3>Unfinished tasks today</h3>
    <p style="font-size:13.5px;color:var(--muted);margin-top:-8px;">You have ${unfinished.length} unfinished task(s). What should happen to them?</p>
    <div class="list">${unfinished.map(t=>`<div class="list-row"><div class="main"><div class="title">${t.title}</div><div class="meta">${subjectName(t.subjectId)} · ${t.progress||0}%</div></div>
      <select id="plan-${t.id}" style="border:1px solid var(--card-border);border-radius:3px;padding:5px;font-size:12.5px;">
        <option value="tomorrow">Move to tomorrow</option>
        <option value="keep">Leave on today</option>
        <option value="missed">Mark as missed</option>
      </select></div>`).join('')}</div>
    <div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button>
    <button class="btn amber" onclick="applyPlanTomorrow(${JSON.stringify(unfinished.map(t=>t.id))})">Apply</button></div>
  `);
}
function applyPlanTomorrow(ids){
  ids.forEach(id=>{
    const sel = document.getElementById('plan-'+id);
    const t = state.tasks.find(x=>x.id===id);
    if(!sel||!t) return;
    if(sel.value==='tomorrow'){ t.plannedDate=addDays(todayStr(),1); t.status='Rescheduled'; }
    else if(sel.value==='missed'){ t.status='Missed'; }
  });
  scheduleSave(); closeModal(); goTo('tomorrow');
}

function dataURLtoBlob(dataurl){
  const arr=dataurl.split(','); const mimeMatch=arr[0].match(/:(.*?);/); const mime=mimeMatch? mimeMatch[1]:'application/pdf';
  const bstr=atob(arr[1]); let n=bstr.length; const u8=new Uint8Array(n);
  while(n--){ u8[n]=bstr.charCodeAt(n); }
  return new Blob([u8], {type:mime});
}
async function viewStoredFile(key){
  try{
    const res=await storageGet(key);
    if(!res || !res.value){ alert('File not found.'); return; }
    if(res.isUrl){ window.open(res.value, '_blank'); return; }
    const blob=dataURLtoBlob(res.value);
    const url=URL.createObjectURL(blob);
    window.open(url,'_blank');
  }catch(e){ alert('Could not open the file.'); }
}

function resolveRevision(id,performance){
  const r = state.revisions.find(x=>x.id===id); if(!r) return;
  r.status = performance==='Skip' ? 'skipped' : 'completed';
  r.performance = performance;
  // adjust next pending revision in the same series based on performance
  const seriesRevs = state.revisions.filter(x=>x.seriesId===r.seriesId).sort((a,b)=>a.index-b.index);
  const next = seriesRevs.find(x=>x.status==='pending' && x.index>r.index);
  if(next){
    const gap = daysBetween(r.date, next.date);
    if(performance==='Forgot'){ next.date = addDays(todayStr(),1); }
    else if(performance==='Weak'){ next.date = addDays(r.date, Math.max(1,Math.round(gap*0.6))); }
    else if(performance==='Strong'){ next.date = addDays(r.date, Math.round(gap*1.5)); }
  }
  scheduleSave(); closeModal(); render();
}

  const r = state.revisions.find(x=>x.id===id); if(!r) return;
  r.date = val('rv-resched'); r.performance='Rescheduled';
  scheduleSave(); closeModal(); render();
}

function suggestExamPlan(examId){
  const ex = state.exams.find(e=>e.id===examId); if(!ex) return;
  const days = daysBetween(todayStr(), ex.date);
  if(days<1) return alert('Exam is too close (or past) to auto-plan.');
  const bufferDays = Math.min(2, Math.floor(days*0.15));
  const workDays = Math.max(1, days-bufferDays);
  const pending = state.tasks.filter(t=>t.subjectId===ex.subjectId && t.status!=='Completed');
  if(!pending.length) return alert('No pending tasks for this subject — you are already on track.');
  pending.sort((a,b)=>{
    const order={Critical:0,High:1,Medium:2,Low:3};
    return (order[a.priority]??2)-(order[b.priority]??2) || (b.difficulty==='Hard'?1:0)-(a.difficulty==='Hard'?1:0);
  });
  pending.forEach((t,i)=>{
    const dayOffset = Math.min(workDays-1, Math.floor(i/Math.max(1,Math.ceil(pending.length/workDays))));
    t.plannedDate = addDays(todayStr(), dayOffset);
  });
  scheduleSave();
  alert(`Distributed ${pending.length} pending task(s) across the next ${workDays} day(s), leaving ${bufferDays} buffer day(s) before the exam.`);
  render();
}

/* ============================================================

function renderCalendar(){
  const {month,year}=calState;
  const first=new Date(year,month,1);
  const startDow=first.getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const monthName=first.toLocaleDateString('en-IN',{month:'long',year:'numeric'});
  let cells=[];
  for(let i=0;i<startDow;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(d);
  const sel = calState.selected;
  const dayEvents = (ds)=>({
    study: state.tasks.filter(t=>t.plannedDate===ds).length,
    rev: state.revisions.filter(r=>r.date===ds).length,
    exam: state.exams.filter(e=>e.date===ds).length,
    fin: state.expenses.filter(e=>e.date===ds).length + state.incomes.filter(e=>e.date===ds).length,
  });
  return `
  ${topbar('Calendar','Everything, on one timeline.')}
  <div class="card" style="margin-bottom:16px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <button class="icon-btn" onclick="calShift(-1)">← Prev</button>
      <div style="font-family:var(--serif);font-weight:600;">${monthName}</div>
      <button class="icon-btn" onclick="calShift(1)">Next →</button>
    </div>
    <div class="calgrid">
      ${['S','M','T','W','T','F','S'].map(d=>`<div class="dow">${d}</div>`).join('')}
      ${cells.map(d=>{
        if(!d) return `<div class="calday other"></div>`;
        const ds = fmtDate(new Date(year,month,d));
        const ev=dayEvents(ds);
        return `<div class="calday ${ds===todayStr()?'today':''} ${ds===sel?'':''}" style="${ds===sel?'outline:2px solid var(--blue);':''}" onclick="calSelect('${ds}')">
          <div class="d-num">${d}</div>
          <div class="dots">
            ${ev.study? `<span class="dot study"></span>`:''}${ev.rev? `<span class="dot rev"></span>`:''}${ev.exam? `<span class="dot exam"></span>`:''}${ev.fin? `<span class="dot fin"></span>`:''}
          </div>
        </div>`;
      }).join('')}
    </div>
    <div style="display:flex;gap:14px;margin-top:12px;font-size:11px;color:var(--muted);">
      <span><span class="dot study" style="display:inline-block;margin-right:4px;"></span>Study</span>
      <span><span class="dot rev" style="display:inline-block;margin-right:4px;"></span>Revision</span>
      <span><span class="dot exam" style="display:inline-block;margin-right:4px;"></span>Exam</span>
      <span><span class="dot fin" style="display:inline-block;margin-right:4px;"></span>Finance</span>
    </div>
  </div>
  <div class="card">
    <div class="section-head"><h2>${humanDate(sel)} · ${sel}</h2></div>
    ${renderDaySummary(sel)}
  </div>
  `;
}
function renderDaySummary(ds){
  const tasks=tasksFor(ds), revs=state.revisions.filter(r=>r.date===ds), exams=state.exams.filter(e=>e.date===ds);
  const exp=state.expenses.filter(e=>e.date===ds), inc=state.incomes.filter(e=>e.date===ds);
  let out='';
  if(tasks.length) out+=`<div class="meta" style="font-weight:600;margin-bottom:4px;">Study</div>${taskGroup(tasks)}`;
  if(revs.length) out+=`<div class="meta" style="font-weight:600;margin:12px 0 4px;">Revisions</div><div class="list">${revs.map(r=>revisionRow(r)).join('')}</div>`;
  if(exams.length) out+=`<div class="meta" style="font-weight:600;margin:12px 0 4px;">Exams</div><div class="list">${exams.map(e=>`<div class="list-row"><div class="main"><div class="title">${e.name}</div></div></div>`).join('')}</div>`;
  if(exp.length||inc.length) out+=`<div class="meta" style="font-weight:600;margin:12px 0 4px;">Finance</div><div class="list">${[...exp.map(e=>({...e,kind:'expense'})),...inc.map(i=>({...i,kind:'income'}))].map(it=>`
    <div class="list-row"><div class="main"><div class="title">${it.kind==='expense'?it.category:it.source}</div></div><span style="font-family:var(--mono);color:${it.kind==='expense'?'var(--red)':'var(--green)'}">${money(it.amount)}</span></div>`).join('')}</div>`;
  return out || `<div class="empty">Nothing on this day.</div>`;
}
function calShift(n){
  calState.month+=n;
  if(calState.month<0){calState.month=11;calState.year--;}
  if(calState.month>11){calState.month=0;calState.year++;}
  render();
}
function calSelect(ds){ calState.selected=ds; render(); }

function renderAnalytics(){
  const days=[...Array(7)].map((_,i)=>addDays(todayStr(),i-6));
  const studyMins = days.map(d=> state.tasks.filter(t=>t.plannedDate===d).reduce((a,t)=>a+Number(t.actualMinutes||0),0) + state.sessions.filter(s=>s.date===d).reduce((a,s)=>a+Number(s.minutes||0),0));
  const spend = days.map(d=> state.expenses.filter(e=>e.date===d).reduce((a,e)=>a+Number(e.amount),0));
  const maxStudy = Math.max(1,...studyMins), maxSpend=Math.max(1,...spend);
  const totalTasks=state.tasks.length, doneTasks=state.tasks.filter(t=>t.status==='Completed').length;
  const compRate = totalTasks? Math.round(doneTasks/totalTasks*100):0;
  const bySubject = state.subjects.map(s=>{

  return `

      <div class="section-head"><h2>Task completion</h2></div>
      <div style="display:flex;align-items:center;gap:18px;">
        <div class="donut" style="background:conic-gradient(var(--green) ${compRate*3.6}deg, #eee7d5 0deg);"><div class="center"><b>${compRate}%</b><span>complete</span></div></div>
        <div class="meta">${doneTasks} of ${totalTasks} tasks completed all-time</div>
      </div>
    </div>
    <div class="card">
      <div class="section-head"><h2>Time by subject</h2></div>
      ${bySubject.map(s=>`<div style="margin-bottom:8px;"><div style="display:flex;justify-content:space-between;font-size:12.5px;"><span>${s.name}</span><span style="font-family:var(--mono);">${minsToHM(s.mins)}</span></div>

    </div>
  </div>
  `;
}

function saveSettings(){
  state.settings.currency=val('set-currency')||'₹';
  state.settings.defaultIntervals=val('set-intervals').split(',').map(x=>parseInt(x.trim())).filter(x=>!isNaN(x));
  state.settings.studyDailyGoalMinutes=Number(val('set-goal'))||360;
  state.settings.pomoWork=Number(val('set-pomo-w'))||25;
  state.settings.pomoBreak=Number(val('set-pomo-b'))||5;
  scheduleSave(); render();
  alert('Settings saved.');
}
function exportBackup(){
  const dataStr=JSON.stringify(state,null,2);
  const blob=new Blob([dataStr],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='logbook-backup-'+todayStr()+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importBackup(){
  const input=document.createElement('input');
  input.type='file'; input.accept='application/json';
  input.onchange=()=>{
    const f=input.files[0]; if(!f) return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const parsed=JSON.parse(reader.result);
        if(!confirm('This replaces your current data with the backup. Continue?')) return;
        state=Object.assign(defaultState(), parsed);
        state.settings=Object.assign(defaultState().settings, parsed.settings||{});
        state.budget=Object.assign(defaultState().budget, parsed.budget||{});
        scheduleSave(); render();
        alert('Backup restored.');
      }catch(e){ alert('Could not read that file — make sure it is a Logbook backup JSON.'); }
    };
    reader.readAsText(f);
  };
  input.click();
}
function resetAll(){
  if(!confirm('This will permanently delete all your data. Continue?')) return;
  state=defaultState(); scheduleSave(); render();
}

function subjectOptions(){
  if(!state.semesters.length) return state.subjects.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
  let html='';
  state.semesters.forEach(sem=>{

    if(subs.length) html+=`<optgroup label="${sem.name}">${subs.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</optgroup>`;
  });
  const noSem=state.subjects.filter(s=>!s.semesterId);
  if(noSem.length) html+=`<optgroup label="Unassigned">${noSem.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</optgroup>`;
  return html;
}
const SUBJECT_COLORS=['#c9821f','#3a5f8a','#3f7d54','#a8402f','#6b5b95','#2f7a7a','#a8763e','#556b2f'];
function randomSubjectColor(){ return SUBJECT_COLORS[state.subjects.length % SUBJECT_COLORS.length]; }
function subjectPickerFields(idPrefix, currentSubjectId, useDatalist){
  if(useDatalist===undefined) useDatalist=true;
  const cur = currentSubjectId? state.subjects.find(s=>s.id===currentSubjectId) : null;
  const curSemId = cur? (cur.semesterId||'') : '';
  const curName = cur? cur.name : '';
  return `<div class="formrow">
    <div class="field"><label>Semester</label><select id="${idPrefix}-semester" onchange="handleSemesterSelect(this)">${semesterSelectOptions(curSemId)}</select></div>
    <div class="field"><label>Subject</label><input id="${idPrefix}-subject-text" ${useDatalist? `list="subject-namelist"`:''} value="${curName}" placeholder="Type subject name"></div>
  </div>`;
}
function resolveSubjectId(idPrefix){
  const semRaw = val(idPrefix+'-semester');
  const semesterId = semRaw==='__new__'? '' : semRaw;
  const name = val(idPrefix+'-subject-text').trim();
  if(!name) return '';
  let subj = state.subjects.find(s=>s.name.toLowerCase()===name.toLowerCase());
  if(!subj){
    subj = {id:uid(), name, color:randomSubjectColor(), semesterId};
    state.subjects.push(subj);
  } else if(semesterId && !subj.semesterId){
    subj.semesterId = semesterId;
  }
  return subj.id;
}
function refreshSubjectDatalist(){
  const dl=document.getElementById('subject-namelist');
  if(dl) dl.innerHTML = state.subjects.map(s=>`<option value="${s.name}">`).join('');
}

    <div class="formrow">
      <div class="field"><label>Task type</label><select id="tk-type">${['Lecture','Theory','Numerical','Problem solving','Revision','Assignment','Lab','Project','PYQ','Mock Test','Other'].map(o=>`<option ${t?.type===o?'selected':''}>${o}</option>`).join('')}</select></div>
      <div class="field"><label>Priority</label><select id="tk-priority">${['Critical','High','Medium','Low'].map(o=>`<option ${t?.priority===o?'selected':''}>${o}</option>`).join('')}</select></div>
    </div>
    <div class="formrow">
      <div class="field"><label>Difficulty</label><select id="tk-diff">${['Easy','Medium','Hard'].map(o=>`<option ${t?.difficulty===o?'selected':''}>${o}</option>`).join('')}</select></div>
      <div class="field"><label>Estimated duration (min)</label><input type="number" id="tk-est" value="${t?.estMinutes||30}"></div>
    </div>
    <div class="formrow">
      <div class="field"><label>Planned date</label><input type="date" id="tk-planned" value="${t?.plannedDate||presetDate||todayStr()}"></div>
      <div class="field"><label>Deadline</label><input type="date" id="tk-deadline" value="${t?.deadline||''}"></div>
    </div>
    <div class="field"><label>Notes</label><textarea id="tk-notes">${t?.notes||''}</textarea></div>
    <div class="modal-actions">
      ${t? `<button class="btn danger" onclick="deleteTask('${t.id}')">Delete</button>`:''}
      <button class="btn secondary" onclick="closeModal()">Cancel</button>
      <button class="btn amber" onclick="saveTask(${t? `'${t.id}'`:'null'})">Save</button>
    </div>
  `);
}
function saveTask(id){
  const data={
    subjectId: resolveSubjectId('tk'), unit: val('tk-unit'), title: val('tk-title'), topic: val('tk-topic'),
    description: val('tk-desc'), type: val('tk-type'), priority: val('tk-priority'), difficulty: val('tk-diff'),
    estMinutes: Number(val('tk-est'))||0, plannedDate: val('tk-planned'), deadline: val('tk-deadline'), notes: val('tk-notes'),
  };
  if(!data.title){ alert('Give the task a title.'); return; }
  if(id){
    Object.assign(state.tasks.find(t=>t.id===id), data);
  } else {
    state.tasks.push(Object.assign({id:uid(), status:'Not Started', progress:0, actualMinutes:0, createdAt:todayStr()}, data));
  }
  scheduleSave(); closeModal(); render();
}
function deleteTask(id){ state.tasks=state.tasks.filter(t=>t.id!==id); scheduleSave(); closeModal(); render(); }

function semesterSelectOptions(selectedId){
  return `<option value="">No semester</option>` +
    state.semesters.map(s=>`<option value="${s.id}" ${selectedId===s.id?'selected':''}>${s.name}</option>`).join('') +
    `<option value="__new__">+ Add new semester…</option>`;
}
function handleSemesterSelect(selectEl){
  if(selectEl.value==='__new__'){
    const name=prompt('New semester name (e.g. Semester 5):');
    if(name && name.trim()){
      const sem={id:uid(), name:name.trim()};
      state.semesters.push(sem); scheduleSave();
      selectEl.innerHTML = semesterSelectOptions(sem.id);
    } else {
      selectEl.value='';
    }
  }
}
function openSubjectModal(subjectId){
  const s = subjectId? state.subjects.find(x=>x.id===subjectId) : null;
  showModal(`
    <h3>${s? 'Edit subject':'Add subject'}</h3>
    <div class="field"><label>Name</label><input id="sub-name" value="${s?.name||''}" placeholder="e.g. Verilog"></div>
    <div class="field"><label>Semester</label><select id="sub-semester" onchange="handleSemesterSelect(this)">${semesterSelectOptions(s?.semesterId||'')}</select></div>
    <div class="field"><label>Color</label><input type="color" id="sub-color" value="${s?.color||'#c9821f'}" style="width:60px;height:34px;padding:2px;"></div>
    <div class="modal-actions">
      ${s? `<button class="btn danger" onclick="deleteSubject('${s.id}')">Delete</button>`:''}
      <button class="btn secondary" onclick="closeModal()">Cancel</button>
      <button class="btn amber" onclick="saveSubject(${s? `'${s.id}'`:'null'})">Save</button>

function saveSubject(id){
  const name=val('sub-name'); if(!name) return;
  const semRaw=val('sub-semester'); const semesterId = semRaw==='__new__'? '' : semRaw;
  if(id){
    Object.assign(state.subjects.find(x=>x.id===id), {name, semesterId, color:val('sub-color')});
  } else {
    state.subjects.push({id:uid(), name, semesterId, color:val('sub-color')});

}

    state.mistakes.push({id:uid(), subjectId, topic, description:val('sm-desc'), date:val('sm-date')||todayStr(), resolved:false});

      <div class="field"><label>Deadline</label><input type="date" id="g-deadline"></div>

/* ============================================================
   TIMER
============================================================ */
let timer = { taskId:null, running:false, mode:'stopwatch', elapsedSec:0, targetSec:0, isBreak:false, interval:null };
function startTimer(taskId){
  const t = state.tasks.find(x=>x.id===taskId); if(!t) return;
  timer = { taskId, running:true, mode:'stopwatch', elapsedSec:0, targetSec:0, isBreak:false, interval:null };
  t.startTime = t.startTime || new Date().toISOString();
  tickTimer();
  render();
}
function startPomodoro(taskId){
  const t = state.tasks.find(x=>x.id===taskId); if(!t) return;
  timer = { taskId, running:true, mode:'pomodoro', elapsedSec:0, targetSec:state.settings.pomoWork*60, isBreak:false, interval:null };
  tickTimer(); render();
}
function tickTimer(){
  clearInterval(timer.interval);
  timer.interval = setInterval(()=>{
    if(!timer.running) return;
    timer.elapsedSec++;
    if(timer.mode==='pomodoro' && timer.elapsedSec>=timer.targetSec){
      timer.isBreak=!timer.isBreak;
      timer.targetSec = (timer.isBreak? state.settings.pomoBreak : state.settings.pomoWork)*60;
      timer.elapsedSec=0;
    }
    renderTimerBar();
  },1000);
}
function pauseTimer(){ timer.running=!timer.running; renderTimerBar(); }
function stopTimer(){
  if(timer.taskId){
    const t = state.tasks.find(x=>x.id===timer.taskId);
    if(t){
      const mins = Math.round(timer.elapsedSec/60) + (timer.mode==='pomodoro'? Math.floor(state.settings.pomoWork*0):0);
      const totalMins = timer.mode==='pomodoro' ? Math.round(timer.elapsedSec/60) : Math.round(timer.elapsedSec/60);
      t.actualMinutes = Number(t.actualMinutes||0) + totalMins;
      state.sessions.push({id:uid(), taskId:t.id, subjectId:t.subjectId, date:todayStr(), minutes:totalMins, focus:null, notes:''});
      if(t.status==='Not Started') t.status='In Progress';
      scheduleSave();
    }
  }
  clearInterval(timer.interval);
  timer = { taskId:null, running:false, mode:'stopwatch', elapsedSec:0, targetSec:0, isBreak:false, interval:null };
  renderTimerBar(); render();
}
function renderTimerBar(){
  const bar=document.getElementById('timerbar');
  if(!timer.taskId){ bar.classList.remove('show'); return; }
  bar.classList.add('show');
  const t = state.tasks.find(x=>x.id===timer.taskId);
  document.getElementById('tb-title').textContent = (t? t.title : 'Task') + (timer.mode==='pomodoro'? (timer.isBreak?' · break':' · focus'):'');
  let displaySec = timer.mode==='pomodoro' ? Math.max(0,timer.targetSec-timer.elapsedSec) : timer.elapsedSec;
  const mm=String(Math.floor(displaySec/60)).padStart(2,'0'), ss=String(displaySec%60).padStart(2,'0');
  document.getElementById('tb-clock').textContent=`${mm}:${ss}`;
  document.getElementById('tb-pause').textContent = timer.running? 'Pause':'Resume';
}
document.getElementById('tb-pause').onclick=pauseTimer;
document.getElementById('tb-stop').onclick=stopTimer;
